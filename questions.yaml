# Test questions, shared by every stage.
#
# Each stage's  sN_run_questions.py  answers ALL of these and writes the results
# to that stage's results/ folder, so stages can be compared on exactly the same questions.
#
# Fields:
#   id:             short name, used in the results file
#   question:       exactly what a user would type. "@place: ..." filters by place, as in s5/s6
#   expect_title:   the article the best chunk should come from
#   expect_section: the section it should come from (matched as part of section_path)
#                   Leave "" if any section of that article is fine.
#   note:           why this question is in the set
#   covered:        (optional) set to false for questions the guides DON'T cover.
#                   The runner then checks that retrieval was weak instead.
#
# If expect_title and expect_section are both "", the runner doesn't check the
# source automatically: read the results file and judge it yourself.
#
# To add a question: copy a block, give it a new id, fill in the fields.

- id: biryani
  question: where can I eat biryani in Old Dhaka?
  expect_title: Dhaka/Old Dhaka
  expect_section: Eat
  note: "Stage 1: answer merged Hajjee Beryani and Haji Biryani"

- id: visa
  question: do I need a visa for Thailand?
  expect_title: Thailand
  expect_section: Entry requirements
  note: "Stage 1: visa-free list not retrieved; answer misread the visa-on-arrival list"

- id: bangkok_street_food
  question: "@bangkok: street food at night"
  expect_title: Bangkok/Yaowarat and Phahurat
  expect_section: Eat
  note: "Stage 1: 3 of 4 results were bare headings. Stage 2: Yaowarat dropped out"

- id: khao_san_hotel
  question: cheap hotel near Khao San Road
  expect_title: Bangkok/Khao San Road
  expect_section: Sleep
  note: "Specific place + accommodation"

- id: dhaka_vague
  question: "@dhaka: how is it?"
  expect_title: Dhaka
  expect_section: ""
  note: "Deliberately vague: retrieval should look weak"

- id: chiang_mai_clinics
  question: medical clinics in Chiang Mai
  expect_title: Chiang Mai
  expect_section: Medical
  note: "Stage 1: the clinic listings lost their '### Medical' heading"

- id: phuket_phi_phi_how
  question: how do I get from Phuket to Ko Phi Phi?
  expect_title: ""
  expect_section: By boat
  note: "Stage 2: 'Get in > By car' outranked 'By boat'. Phuket or Ko Phi Phi article both fine"

- id: phuket_phi_phi_ferry
  question: ferry from Phuket to Ko Phi Phi
  expect_title: ""
  expect_section: By boat
  note: "Same need as above, different wording"

- id: krabi_beaches
  question: beaches near Krabi
  expect_title: ""
  expect_section: ""
  note: "Tests is_part_of in the context line: Ao Nang chunks say 'Ao Nang (Krabi Province)'"

- id: yaowarat_food
  question: street food in Yaowarat
  expect_title: Bangkok/Yaowarat and Phahurat
  expect_section: Eat
  note: "Is the Yaowarat street-food chunk findable when asked about directly?"

- id: vaping
  question: can I vape in Thailand?
  expect_title: Thailand
  expect_section: Vaping
  note: "Specific legal fact in a short section. Stage 2 answer contradicted its source once"

- id: best_time
  question: what is the best time of year to visit Thailand?
  expect_title: Thailand
  expect_section: Climate
  note: "Paragraph-style content, not listings"

- id: greeting
  question: how do I greet people in Thailand?
  expect_title: Thailand
  expect_section: The wai
  note: "Question words ('greet') differ from the heading ('The wai')"

- id: off_topic
  question: what is the capital of France?
  expect_title: ""
  expect_section: ""
  covered: false
  note: "Not covered: retrieval should be weak and the answer should say it couldn't find it"

# --- Bangladesh (added with the 21 new articles in step 2.5) -----------------

- id: saint_martin_ferry
  question: how do I get from Teknaf to Saint Martins Island?
  expect_title: Saint Martins Island
  expect_section: Get in
  note: "Ferry details sit under 'Get in > By bus' (bus to Teknaf, then the ship). Good answer: ships at 9-9:30AM, ~2 h, none in the off-season (May-Aug/Sep)"

- id: bd_visa_on_arrival
  question: can I get a visa on arrival in Bangladesh, and how much does it cost?
  expect_title: Bangladesh
  expect_section: Visa On Arrival
  note: "Deep heading (Get in > Visas > Visa On Arrival). Good answer: US$51 or EUR 51 in cash, 30 days, extendable by 30"

- id: sundarbans_from_khulna
  question: how can I visit the Sundarbans from Khulna?
  expect_title: Sundarbans (Bangladesh)
  expect_section: Get in
  note: "Good answer: multi-day safaris/package tours from Khulna (or Dhaka); DIY needs a permit and a boat from Mongla"

- id: sundarbans_permit
  question: do I need a permit to visit the Sundarbans?
  expect_title: Sundarbans (Bangladesh)
  expect_section: ""
  note: "The fact is in both 'Get in' and the tiny 'Fees and permits' section, so any section of the article is fine. Good answer: yes, from the Divisional Forest Office in Khulna"

- id: tea_gardens
  question: where can I see tea gardens in Bangladesh?
  expect_title: Srimangal
  expect_section: ""
  note: "No place name in the question: tests whether a short 'outline' article is found across 47 articles. Good answer: Srimangal (Sreemangal), 'tea capital of Bangladesh'"

- id: sajek_from_dhaka
  question: how do I get to Sajek Valley from Dhaka?
  expect_title: Sajek Valley
  expect_section: From Dhaka
  note: "Good answer: bus to Khagrachhari, then a jeep ('Chander Gari'), CNG or motorbike, 2-3 h; vehicles often go in security convoys"

- id: coxs_bazar_sleep
  question: "@cox's bazar: where can I stay?"
  expect_title: Cox's Bazar
  expect_section: Sleep
  note: "Place filter with an apostrophe in the name. Long Sleep section, so it splits into several chunks"
